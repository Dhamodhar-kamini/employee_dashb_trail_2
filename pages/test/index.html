<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Unified Interview Widget -->
    <div class="interview-widget">
        
        <!-- Left Side: Actions -->
        <div class="widget-action-pane">
            <img src="https://img.icons8.com/color/96/google-calendar--v2.png" alt="Google Calendar" style="width: 64px; margin-bottom: 15px;">
            
            <!-- Dynamic Counter -->
            <div class="stat-count" id="totalCount">0</div>
            <div class="stat-label">Upcoming Meetings</div>

            <button class="btn-schedule" onclick="openModal()">
                <span>+</span> Schedule Interview
            </button>
        </div>

        <!-- Right Side: List -->
        <div class="widget-list-pane">
            <div class="pane-header">
                <h3>Scheduled Interviews</h3>
            </div>

            <div class="interview-list" id="interviewListContainer">
                <!-- Javascript will inject items here -->
            </div>
        </div>
    </div>


    <!-- Modal Form -->
    <div id="scheduleModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 20px;">Schedule Meeting</h3>
            
            <div class="form-group">
                <label>Interview / Meeting Title</label>
                <input type="text" id="intTitle" placeholder="e.g. Technical Round">
            </div>
            
            <div class="form-group">
                <label>Candidate / Attendee</label>
                <input type="text" id="intCandidate" placeholder="Name">
            </div>

            <div class="form-group">
                <label>Meeting Link (Zoom/Meet/Teams)</label>
                <input type="url" id="intLink" placeholder="https://...">
            </div>

            <div class="form-group" style="display:flex; gap:10px;">
                <div style="flex:1">
                    <label>Date</label>
                    <input type="date" id="intDate">
                </div>
                <div style="flex:1">
                    <label>Time (AM/PM)</label>
                    <input type="time" id="intTime">
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn-outline" onclick="closeModal()">Cancel</button>
                <button class="btn-schedule" onclick="handleSchedule()">Save & Add to Calendar</button>
            </div>
        </div>
    </div>

    <!-- Link to external JavaScript -->
    <script src="script.js"></script>
</body>
</html>
