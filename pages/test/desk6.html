<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHR Pro Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Link to CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Stats Section -->
    <div class="dashboard-grid">
        <div class="stat-card">
            <div class="stat-header">Total Responses</div>
            <div class="stat-number">142</div>
            <div class="stat-desc">Requests Logged</div>
        </div>
        <div class="stat-card">
            <div class="stat-header" style="color: var(--primary);">Pending</div>
            <div class="stat-number" style="color: var(--primary);">28</div>
            <div class="stat-desc">Requires Attention</div>
        </div>
        <div class="stat-card">
            <div class="stat-header">Solved</div>
            <div class="stat-number">104</div>
            <div class="stat-desc">Completed</div>
        </div>
    </div>

    <!-- Table Section -->
    <div class="table-container">
        <div class="table-header">
            <h2 class="table-title">Support Tickets <span class="title-badge" id="ticketCount">0</span></h2>
        </div>
        <table>
            <thead>
                <tr>
                    <th width="80px">#</th>
                    <th>Subject</th>
                    <th>Requester</th>
                    <th width="120px">Status</th>
                    <th width="80px" style="text-align:right">Action</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Rows generated by JS -->
            </tbody>
        </table>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-card">
            <h3 style="margin-bottom: 20px;">Update Ticket</h3>
            <form id="editForm" onsubmit="saveChanges(event)">
                <div class="input-group">
                    <label class="input-label">Name</label>
                    <input type="text" class="input-field" id="editName" required>
                </div>
                <div class="input-group">
                    <label class="input-label">Email</label>
                    <input type="email" class="input-field" id="editEmail" required>
                </div>
                <div class="input-group">
                    <label class="input-label">Status</label>
                    <select class="select-field" id="editStatus">
                        <option value="Open">Open</option>
                        <option value="Closed">Closed</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-save">Save Changes</button>
                <button type="button" class="btn" onclick="closeModal()">Cancel</button>
            </form>
        </div>
    </div>

    <!-- Link to JS -->
    <script src="script.js"></script>
</body>
</html>
