<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HR Dashboard Cards</title>
    <link rel="stylesheet" href="employee.css" />
  </head>

  <body>
    <div class="dashboard">
      <!-- BIRTHDAY CARD -->

      <div class="birthday-card">
        <h2>Team Birthday</h2>

        <div class="birthday-profile">
          <img src="https://randomuser.me/api/portraits/women/65.jpg" />

          <h3>Andrew Jermia</h3>

          <p>IOS Developer</p>
        </div>

        <div class="birthday-actions">
          <button class="wish-btn">Send Wishes</button>
          <button class="view-btn">View All Birthdays</button>
        </div>
      </div>

      <!-- LEAVE POLICY -->

      <div class="leave-card">
        <div class="leave-left">
          <h3>Leave Policy</h3>

          <p>Last Updated: Today</p>
        </div>

        <button class="small-btn">View All</button>
      </div>

      <!-- HOLIDAY CARD -->

      <div class="holiday-card">
        <div class="holiday-left">
          <h3>Next Holiday</h3>

          <p>Diwali, 15 Sep 2025</p>
        </div>

        <button class="small-btn">View All</button>
      </div>
    </div>
  </body>
</html>
